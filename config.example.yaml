# omniscience-cyber — configuration (copy to config.yaml and edit)
# Everything is local/offline. Set YOUR OWN guardrails here.

# ── Models (Ollama tags; build the uncensored ones via modelfiles/) ───────────
# Default generator. codestral-pentest (22B coder) is a good 16GB-GPU default: it fits and is
# strong at PoC/payload code. For the most capable answers use qwen3.8-pentest / qwen3.9-pentest / muse-pentest
# (expect CPU offload on 16GB); for the fastest agentic model use nemotron-pentest (30B MoE,
# ~3B active). On a laptop, use gemma4-pentest (12B), qwen-pentest (7B), or qwen-pentest-web/infra for specialized tasks.
chat_model: codestral-pentest
embedding_model: all-MiniLM-L6-v2   # local sentence-transformers model (offline after 1st cache)
db_dir: db                          # persistent ChromaDB directory
cards_dir: cards                    # the distilled security cards

# Automatic fallback: if the primary model errors (not pulled, OOM, Ollama hiccup) or returns
# empty, the RAG tries these in order until one answers. Ordered strongest→lightest so it always
# walks down to something that runs on your hardware. Trim to the models you actually built.
model_fallbacks:
  - muse-pentest              # Meta 30B — top agentic/coding (needs offload on 16GB)
  - qwen3.9-pentest           # next-gen Qwen 27B — enhanced reasoning & coding
  - qwen3.8-pentest           # newest Qwen 27B
  - qwen3-pentest-30b         # Qwen3-Coder 30B (coder-specialized)
  - qwen3.6-pentest           # Qwen3.6 35B
  - nemotron-pentest          # 30B MoE — fastest 30B-class
  - mistral-pentest           # 24B all-rounder
  - codestral-pentest         # 22B coder (fits 16GB)
  - gemma4-pentest            # 12B (laptop-friendly)
  - qwen-pentest-web          # 7B — web app specialization
  - qwen-pentest-infra        # 7B — infra/network specialization
  - qwen-pentest-14b          # 14B (pre-2025 coder base)
  - qwen-pentest-1.5b         # 1.5B — ultra-lightweight for CPU
  - gemma-pentest             # older gemma3 27B
  - qwen-pentest-32b          # older qwen2.5-coder 32B
  - qwen-pentest              # 7B (always-available safety net)
  - qwen2.5-coder:7b          # raw base, last resort

# ── Generation ────────────────────────────────────────────────────────────────
temperature: 0.1                    # low = fewer hallucinations; extraction paths use 0.0
top_k: 4                            # cards returned per question (after re-ranking)

# Speed vs accuracy for "thinking" models (qwen3.x, muse, nemotron, gemma4):
#   true  = always reason first (most accurate, slower)
#   false = never reason (fastest)
#   null  = model default for ask/harden (reason), always off for /tool (clean commands)
# Override per request: CLI --think/--no-think, or "think": true/false in the API body.
think: null

# ── Retrieval (hybrid: embedding similarity + keyword overlap) ─────────────────
# The retriever over-fetches candidates then re-ranks them, blending vector similarity with
# a keyword-overlap boost against each card's title + `*Keywords:*` line — so a query that
# names a technique lands the right card even when the raw embedding is fuzzy.
retrieve_candidate_mult: 4          # over-fetch this * top_k candidates before re-ranking
keyword_weight: 0.3                 # 0 = pure embeddings, 1 = pure keyword overlap (0.3 default)
min_relevance: 0.0                  # drop hits scoring below this (0..1); 0 = keep top_k always

# ── HTTP API security (rag/api.py) ────────────────────────────────────────────
# The API generates attack commands, so treat it as sensitive.
#   * Loopback (127.0.0.1) needs no token. Binding 0.0.0.0/LAN is fail-closed:
#     it REQUIRES a token (or an explicit --insecure override).
#   * The env var OMNISCIENCE_API_TOKEN overrides this value. Prefer the env var
#     so the secret never lands in a file. Leave null for loopback-only dev.
api_token: null                     # e.g. a long random hex string for LAN use
# Append-only local audit trail of every request (who asked what, what was blocked).
# Useful engagement evidence. Set to false to disable. Path is relative to repo root.
audit_log: logs/audit.jsonl

# ── Two-model verifier (verify.py) ────────────────────────────────────────────
# A second model re-checks the first's answer for fabricated CVSS / payload / scope claims.
verifier_model: null                # null = auto-pick the highest-ranked OTHER pulled model
# Authority ranking — a LOWER-ranked verifier can only FLAG, never override a stronger model.
# Tiers updated from Aug 2026 agentic/coding benchmarks (Terminal-Bench, SWE-Bench, PinchBench,
# MCP-Atlas). Higher = more authority. You only need to list the models you actually run.
model_rank:
  muse-pentest: 9               # Meta 30B — beats gemma4-31b / qwen3.6-27b across agentic benchmarks
  qwen3.9-pentest: 9            # next-gen Qwen 27B — enhanced reasoning & coding (Terminal-Bench 75+)
  qwen3.8-pentest: 9            # newest Qwen 27B — huge jump over 3.6 (Terminal-Bench 73 vs 63)
  qwen3-pentest-30b: 9          # Qwen3-Coder 30B — ~= qwen3.8 for agentic coding
  qwen3.6-pentest: 8            # Qwen3.6 35B (strong; the 27B variant is weaker → lower)
  nemotron-pentest: 7           # 30B MoE — fast, accuracy just behind the leaders
  mistral-pentest: 6
  gemma4-pentest: 6
  qwen-pentest-web: 5           # web app specialization
  qwen-pentest-infra: 5         # infra/network specialization
  gemma-pentest: 6              # older gemma3 27B — still a capable verifier
  codestral-pentest: 5
  qwen-pentest-32b: 5
  qwen-pentest-14b: 4
  qwen-pentest: 3
  qwen-pentest-1.5b: 2
  qwen2.5-coder:7b: 3

# ── YOUR GUARDRAILS (the important part) ──────────────────────────────────────
guardrails:
  # The assistant NEVER decides scope. List your engagement's authorized hosts here.
  # ENFORCED, not just advised: rag/scope_guard.py checks every generated Kali command
  # against this list and BLOCKS any command targeting a host not on it (subdomains and
  # CIDR ranges like "10.10.0.0/24" are matched). Empty list = scope can't be verified,
  # so out-of-scope targets are WARNed rather than blocked. YOU own this list.
  in_scope_hosts: []                # e.g. ["staging.example.com", "api.staging.example.com"]

  # Hard limits, ENFORCED by scope_guard.py on generated commands (not just a prompt hint):
  # a command matching a forbidden pattern (DoS/stress flags, sqlmap --dump-all, unthrottled
  # hydra, nmap -T5, …) is BLOCKED before it can reach a shell. The *-pentest Modelfiles are
  # still tuned to NOT refuse legitimate impact-limited asks — this only stops the dangerous ones.
  forbid:
    - dos_or_stress_testing         # no load/flood/DoS
    - bulk_real_pii_exfiltration    # PoCs stay impact-limited (one record)
    - out_of_scope_targets          # only in_scope_hosts above
  require:
    - authorized_engagement         # use only under a signed engagement / bug-bounty scope
    - impact_limited_poc            # prove impact, then stop

  # Anti-hallucination: when the cards don't cover a question, the model must SAY SO
  # ("not in my security sources") rather than invent a CVSS vector / payload / scope call.
  grounding_rules: |
    Answer for an AUTHORIZED penetration test using ONLY the provided security cards when
    they cover the question. If they don't, say "This isn't in my security sources —" first,
    then optionally add clearly-labeled general knowledge. Never fabricate a CVSS vector or
    score, an exact payload, or an in-scope/out-of-scope decision. For scope, defer to the
    in_scope_hosts list / the program owner. Cite which card you used.
